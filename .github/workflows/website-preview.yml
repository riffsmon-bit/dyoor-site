name: Website preview checks

on:
  pull_request:
  push:
    branches: [preview/dyoor-fun-refresh]

permissions:
  contents: read

concurrency:
  group: website-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:website
      - run: npm run test:droid-os-ui
      - run: npm run test:droid-ask
      - run: npm run test:droid-mission-review
      - run: npm run test:droid-kuru
      - run: npm run test:droid-assist
      - run: npm run test:droid-lab-server
      - run: node --test test/dyoor-world-security.test.js test/trait-lab-reroll-regression.test.js
      - name: Install pinned local contract toolchain
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1 resolved 2026-09-06
        with:
          version: v1.5.1
      - run: npm run test:droid-contracts
      - run: npm run test:droid-v2
      - run: npm run test:droid-missions
      - run: npm run test:droid-mission-flow
      - run: npm run test:droid-wrapper-flow
      - run: npm run test:droid-contract-flow
      - run: npm run build
