[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
remappings = ["@droid-oz/=../../lib/seadrop/lib/openzeppelin-contracts/contracts/"]
allow_paths = ["../../lib/seadrop/lib/openzeppelin-contracts/contracts"]
solc_version = "0.8.24"
# The live Season 2 transfer validator uses post-Paris opcodes.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fuzz.runs = 256

[profile.monad_fork]
test = "fork-test"
