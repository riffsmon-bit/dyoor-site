<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DYOOR</title>

  <style>
    body {
      margin:0;
      font-family: Arial, sans-serif;
      background:#0a0a0a;
      color:#fff;
      text-align:center;
    }

    .container {
      max-width:900px;
      margin:auto;
      padding:40px 20px;
    }

    h1 {
      font-size:40px;
      margin-bottom:10px;
    }

    button {
      padding:12px 18px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      font-weight:bold;
      margin:8px;
    }

    .primary { background:#00ffa3; color:#000; }
    .secondary { background:#222; color:#fff; }

    #wlResult {
      margin-top:15px;
      font-size:14px;
    }

    /* BATTERY */
    #ascensionBattery {
      margin-top:20px;
      padding:14px;
      border-radius:12px;
      background:rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.1);
    }

    /* MARQUEE */
    .marquee {
      overflow:hidden;
      margin-top:40px;
    }

    .marquee__track {
      display:flex;
      gap:12px;
      animation: scroll 25s linear infinite;
    }

    .marquee__item img {
      width:120px;
      border-radius:10px;
    }

    @keyframes scroll {
      from { transform:translateX(0); }
      to { transform:translateX(-50%); }
    }

  </style>
</head>

<body>

<div class="container">

  <h1>DYOOR</h1>
  <p>Ascension Protocol Live</p>

  <!-- CONNECT -->
  <button id="btnConnectWL" class="primary">Connect Wallet</button>
  <button id="btnCheckWL" class="secondary">Check WL</button>

  <div id="wlResult"></div>

  <!-- ASCENSION BATTERY -->
  <div id="ascensionBattery">
    🔋 Ascension Battery: <span id="batteryCount">Loading...</span>
  </div>

  <!-- COLLECTION PREVIEW -->
  <div class="marquee">
    <div id="collectionMarquee" class="marquee__track"></div>
  </div>

</div>

<!-- WALLET MODAL -->
<div id="walletModal" style="
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
">
  <div style="background:#111;padding:20px;border-radius:12px;">
    <h3>Select Wallet</h3>

    <button onclick="connectWithWallet('metamask')">MetaMask</button>
    <button onclick="connectWithWallet('okx')">OKX</button>
    <button onclick="connectWithWallet('walletconnect')">WalletConnect</button>

    <br/><br/>
    <button onclick="closeWalletModal()">Close</button>
  </div>
</div>

<script>
  // show modal fix
  function openWalletModal(){
    document.getElementById("walletModal").style.display = "flex";
  }
  function closeWalletModal(){
    document.getElementById("walletModal").style.display = "none";
  }
</script>

<!-- YOUR MAIN SCRIPT -->
<script src="/script.js"></script>

</body>
</html>
