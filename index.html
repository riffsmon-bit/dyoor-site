<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DYOOR</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* TITLE */
h1 {
  font-size: 48px;
  margin-top: 60px;
}

/* SUBTEXT */
.subtitle {
  opacity: 0.7;
  margin-bottom: 40px;
}

/* COLLECTION */
.marquee {
  display: flex;
  overflow-x: auto;
  gap: 16px;
  padding: 20px;
}

.marquee img {
  width: 120px;
  border-radius: 12px;
}

/* 🔋 BATTERY */

.glowBatteryCard {
  position: relative;
  max-width: 800px;
  margin: 40px auto;
  padding: 24px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 40px rgba(140,92,255,0.2);
}

.glowBatteryAura {
  position: absolute;
  inset: -40%;
  background: radial-gradient(circle, rgba(140,92,255,0.2), transparent);
  filter: blur(40px);
  animation: auraPulse 5s infinite ease-in-out;
}

.homeBatteryTitle {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 20px;
}

.homeBatteryRow {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.glowBatteryBar {
  height: 18px;
  border-radius: 999px;
  background: rgba(255,255,255,0.1);
  overflow: hidden;
}

.glowBatteryFill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg,#8b5cf6,#3b82f6,#22c55e);
  background-size: 200%;
  animation: flow 2s linear infinite;
}

.glowBatteryMeta {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.8;
}

/* BUTTON */
.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 20px;
  border-radius: 12px;
  background: linear-gradient(90deg,#8b5cf6,#22c55e);
  color: white;
  text-decoration: none;
  font-weight: bold;
}

/* ANIMATIONS */
@keyframes flow {
  0% { background-position: 0% }
  100% { background-position: 200% }
}

@keyframes auraPulse {
  0%,100% { transform: scale(1); opacity: 0.7 }
  50% { transform: scale(1.1); opacity: 1 }
}
</style>
</head>

<body>

<!-- TITLE -->
<h1>DYOOR</h1>
<div class="subtitle">Ascension Protocol Live</div>

<!-- S1 COLLECTION -->
<h3>S1 Collection on Monad</h3>
<div class="marquee">
  <img src="https://ipfs.io/ipfs/QmcXRP7VV5Ne3NExitFH5SzvVtHdQwScY6Dz8W1H7RYYQD/1.png">
  <img src="https://ipfs.io/ipfs/QmcXRP7VV5Ne3NExitFH5SzvVtHdQwScY6Dz8W1H7RYYQD/2.png">
  <img src="https://ipfs.io/ipfs/QmcXRP7VV5Ne3NExitFH5SzvVtHdQwScY6Dz8W1H7RYYQD/3.png">
  <img src="https://ipfs.io/ipfs/QmcXRP7VV5Ne3NExitFH5SzvVtHdQwScY6Dz8W1H7RYYQD/4.png">
</div>

<!-- 🔋 BATTERY -->
<div class="glowBatteryCard">
  <div class="glowBatteryAura"></div>

  <div class="homeBatteryTitle">Ascension Battery</div>

  <div class="homeBatteryRow">
    <div id="ascensionBatteryLabel">Charging ⚡</div>
    <div id="ascensionPercent">LIVE</div>
  </div>

  <div class="glowBatteryBar">
    <div id="ascensionBarFill" class="glowBatteryFill"></div>
  </div>

  <div class="glowBatteryMeta">
    The battery is active. Ascension energy is flowing.
  </div>

  <a href="/stake.html" class="btn">
    Enter Ascension Protocol →
  </a>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("ascensionBarFill").style.width = "100%";
});
</script>

</body>
</html>
