<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DYOOR</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0a0a0a;
      color:#fff;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:20px;
    }

    h1{
      font-size:42px;
      margin-bottom:10px;
    }

    /* ===== ASCENSION BATTERY ===== */

    .ascensionBatteryCard{
      margin:40px auto 0;
      padding:20px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.03);
    }

    .ascensionBatteryTop{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      margin-bottom:10px;
    }

    .ascensionTitle{
      font-size:26px;
      font-weight:900;
    }

    .ascensionPercent{
      font-size:26px;
      color:#00ffc8;
      font-weight:900;
    }

    .ascensionBar{
      height:18px;
      background:#111;
      border-radius:999px;
      overflow:hidden;
      margin-top:10px;
    }

    .ascensionBarFill{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#00ffc8,#8cff66);
      transition:0.4s;
    }

    .ascensionMeta{
      margin-top:10px;
      font-size:14px;
      display:flex;
      justify-content:space-between;
      opacity:0.8;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>DYOOR</h1>
  <p>Season 1 is live on Monad.</p>

  <!-- 🔋 ASCENSION BATTERY -->
  <section class="ascensionBatteryCard">

    <div class="ascensionBatteryTop">
      <div>
        <div style="font-size:12px;opacity:.6;">GLOBAL PROTOCOL</div>
        <div class="ascensionTitle">Ascension Battery 🔋</div>
      </div>

      <div id="ascensionPercent" class="ascensionPercent">--%</div>
    </div>

    <div class="ascensionBar">
      <div id="ascensionBarFill" class="ascensionBarFill"></div>
    </div>

    <div class="ascensionMeta">
      <div id="ascensionCount">Loading...</div>
      <div id="ascensionSub">Scanning chain...</div>
    </div>

  </section>

</div>

<script src="script.js"></script>
</body>
</html>
