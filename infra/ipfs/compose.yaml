services:
  ipfs:
    image: ipfs/kubo:v0.43.0
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
      GOMAXPROCS: ${IPFS_CPU_LIMIT:-2}
      GOMEMLIMIT: ${IPFS_MEMORY_LIMIT:-1800MiB}
    volumes:
      - ./data:/data/ipfs
      - ./staging:/export
      - ./init:/container-init.d:ro
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
    expose:
      - "5001"
      - "8080"
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      ipfs:
        condition: service_healthy
    environment:
      IPFS_GATEWAY_HOST: ${IPFS_GATEWAY_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

volumes:
  caddy_data:
  caddy_config:
