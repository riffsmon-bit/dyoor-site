[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[context.deploy-preview.environment]
  MONAD_READ_RPC_URLS = "https://rpc.monad.xyz,https://rpc2.monad.xyz,https://rpc3.monad.xyz,https://rpc-mainnet.monadinfra.com"
  DYOOR_WORLD_RPC_TIMEOUT_MS = "4000"
  DYOOR_S2_ERC721_ENUMERABLE = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "data/quest-seed.json",
    "data/ascension-blueprints.json",
    "data/ascension-blueprint-wallets.json",
    "!.env",
    "!.env.*",
    "!**/.env",
    "!**/.env.*"
  ]

[[headers]]
  for = "/dyoor-world-sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=UTF-8"
    Service-Worker-Allowed = "/"
