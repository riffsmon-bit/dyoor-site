<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DYOOR – Soft Staking</title>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    .card { padding:24px; background:#111; border-radius:12px; margin-bottom:20px; }
    .btn { padding:12px 18px; cursor:pointer; border-radius:8px; border:1px solid #333; background:#1a1a1a; color:#fff; }
    .btn-primary { background:#fff; color:#000; }
    .btn-row { display:flex; gap:12px; flex-wrap:wrap; }
    .muted { opacity:.6; font-size:14px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:10px; border-bottom:1px solid #222; text-align:left; }
  </style>
</head>
<body>

<main style="max-width:900px;margin:60px auto;padding:20px;">

  <h1>Soft Staking</h1>
  <p class="muted">Hold DYOOR NFTs and register for snapshot rewards.</p>

  <div class="card">
    <div id="accountLine" class="muted">Not connected</div>
    <div style="height:15px"></div>

    <div class="btn-row">
      <button id="connectBtn" class="btn">Connect Wallet</button>
      <button id="enableStake" class="btn btn-primary" disabled>Enable Soft Staking</button>
    </div>

    <div style="height:15px"></div>
    <div id="stakeStatus" class="muted"></div>
  </div>

  <div class="card">
    <h2>Leaderboard</h2>
    <div class="btn-row">
      <button id="refreshBoard" class="btn">Refresh</button>
      <a href="/.netlify/functions/stake-registry?action=csv&mode=current" target="_blank" class="btn">Export CSV</a>
    </div>

    <div style="height:20px"></div>

    <table id="leaderboard">
      <thead>
        <tr>
          <th>Wallet</th>
          <th>Staked NFTs</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</main>

<!-- Wallet Connect Modal (required by script.js) -->
<div id="walletModal" class="wallet-modal" aria-hidden="true">
  <div class="wallet-modal__backdrop" data-close="1"></div>
  <div class="wallet-modal__panel">
    <div class="wallet-modal__header">
      <div>Connect Wallet</div>
      <button type="button" data-close="1">✕</button>
    </div>
    <div class="wallet-modal__grid">
      <button type="button" class="wallet-option" data-wallet="metamask">MetaMask</button>
      <button type="button" class="wallet-option" data-wallet="walletconnect">WalletConnect</button>
    </div>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/ethers@6.11.1/dist/ethers.umd.min.js"></script>
<script defer src="https://unpkg.com/@walletconnect/ethereum-provider@2.23.1/dist/index.umd.js"></script>
<script defer src="/script.js?v=stake2"></script>

<script>
let account = null;

async function waitForAccount() {
  return new Promise(resolve => {
    const interval = setInterval(() => {
      if (window.account) {
        account = window.account;
        document.getElementById("accountLine").innerText =
          account.substring(0,6)+"..."+account.substring(account.length-4);
        document.getElementById("enableStake").disabled = false;
        clearInterval(interval);
        resolve(account);
      }
    }, 300);
  });
}

document.getElementById("connectBtn").addEventListener("click", async () => {
  if (window.connect) {
    await window.connect();
    await waitForAccount();
  }
});

document.getElementById("enableStake").addEventListener("click", async () => {
  if (!account) return;

  document.getElementById("stakeStatus").innerText = "Verifying on-chain holdings...";

  const res = await fetch('/.netlify/functions/stake-registry?action=update', {
    method: 'POST',
    headers: { 'content-type':'application/json' },
    body: JSON.stringify({ wallet: account })
  });

  const data = await res.json();
  if (data.ok) {
    document.getElementById("stakeStatus").innerText =
      "Soft staking enabled. Current holdings: " + data.row.staked_count;
    loadLeaderboard();
  } else {
    document.getElementById("stakeStatus").innerText = "Error enabling staking.";
  }
});

async function loadLeaderboard() {
  const res = await fetch('/.netlify/functions/stake-registry?action=leaderboard');
  const data = await res.json();
  const tbody = document.querySelector("#leaderboard tbody");
  tbody.innerHTML = "";

  if (!data.rows) return;

  data.rows.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.wallet.substring(0,6)}...${r.wallet.substring(r.wallet.length-4)}</td>
      <td>${r.staked_count}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById("refreshBoard").addEventListener("click", loadLeaderboard);

loadLeaderboard();
</script>

</body>
</html>
